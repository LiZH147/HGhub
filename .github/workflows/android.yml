name: Android APK
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to build (leave empty to use the selected branch)
        required: false
        default: ""
      target:
        description: Android ABI
        type: choice
        default: aarch64
        options: [aarch64, armv7, x86_64, i686]
      build_type:
        description: Build type
        type: choice
        default: debug
        options: [debug, release]
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK and platform
        run: sdkmanager --install "ndk;27.0.12077973" "platforms;android-35" "build-tools;35.0.0"
      - name: Export NDK environment
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/27.0.12077973"
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          LIBCLANG=$(dirname "$(find "$NDK/toolchains/llvm/prebuilt/linux-x86_64" -name 'libclang.so*' | head -n 1)")
          echo "LIBCLANG_PATH=$LIBCLANG" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - name: Generate the Android project
        run: pnpm tauri android init --ci
      - name: Build APK
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: pnpm tauri android build --${{ inputs.build_type || 'debug' }} --apk --target ${{ inputs.target || 'aarch64' }} --ci
      - uses: actions/upload-artifact@v4
        with:
          name: hghub-android-${{ inputs.target || 'aarch64' }}-${{ inputs.build_type || 'debug' }}
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
