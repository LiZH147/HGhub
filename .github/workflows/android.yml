name: Android APK
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or SHA to build (leave empty to use the selected branch)
        required: false
        default: ""
      target:
        description: Android ABI
        type: choice
        default: aarch64
        options: [aarch64, armv7, x86_64, i686]
      build_type:
        description: Build type
        type: choice
        default: debug
        options: [debug, release]
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install Android NDK and platform
        run: sdkmanager --install "ndk;27.0.12077973" "platforms;android-35" "build-tools;35.0.0"
      - name: Export NDK environment
        run: |
          NDK="$ANDROID_SDK_ROOT/ndk/27.0.12077973"
          echo "NDK_HOME=$NDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK" >> "$GITHUB_ENV"
          LIBCLANG=$(dirname "$(find "$NDK/toolchains/llvm/prebuilt/linux-x86_64" -name 'libclang.so*' | head -n 1)")
          echo "LIBCLANG_PATH=$LIBCLANG" >> "$GITHUB_ENV"
      - run: pnpm install --frozen-lockfile
      - name: Generate the Android project
        run: pnpm tauri android init --ci
      - name: Configure release signing
        if: ${{ (inputs.build_type || 'debug') == 'release' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEY_ALIAS KEY_PASSWORD STORE_PASSWORD; do
            eval "value=\$$name"
            if [ -z "$value" ]; then
              echo "::error::Missing repository secret ANDROID_$name; a release APK needs all four signing secrets."
              exit 1
            fi
          done
          KEYSTORE="$PWD/src-tauri/gen/android/app/release.keystore"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
          {
            echo "HGHUB_KEYSTORE=$KEYSTORE"
            echo "HGHUB_KEY_ALIAS=$KEY_ALIAS"
            echo "HGHUB_KEY_PASSWORD=$KEY_PASSWORD"
            echo "HGHUB_STORE_PASSWORD=$STORE_PASSWORD"
          } >> "$GITHUB_ENV"
          python3 scripts/android-signing.py src-tauri/gen/android/app/build.gradle.kts
      - name: Build APK
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          FLAGS=""
          if [ "${{ inputs.build_type || 'debug' }}" = "debug" ]; then FLAGS="--debug"; fi
          pnpm tauri android build $FLAGS --apk --target ${{ inputs.target || 'aarch64' }} --ci
      - uses: actions/upload-artifact@v4
        with:
          name: hghub-android-${{ inputs.target || 'aarch64' }}-${{ inputs.build_type || 'debug' }}
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
